<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nocturne</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#msg{position:fixed;left:0;right:0;bottom:6vh;text-align:center;font:500 22px/1.4 system-ui,sans-serif;color:#e9edf2;opacity:.75;letter-spacing:.02em;transition:opacity .8s}
#credit{position:fixed;left:2.2vw;bottom:2vh;font:12px system-ui,sans-serif;color:#e9edf2;opacity:.28;letter-spacing:.05em}
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="msg">Connecting to Nocturne on your phone…</div>
<div id="credit">by Hassan Al-Yunis</div>
<script>
// Nocturne TV: the phone listens and analyses; this page only draws, at the TV's own resolution.
const msg = document.getElementById('msg');
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {antialias:false, depth:false, stencil:false, premultipliedAlpha:false, powerPreference:'high-performance'});
if(!gl) msg.textContent = "This TV's browser can't run the visuals (WebGL 2 missing).";
const floatOK = gl && !!gl.getExtension('EXT_color_buffer_float');
const STY = [ // zoom, rot, shiftY, decay, keep, warp, hue  (same as the phone)
  [1.000,0,0.0015,0.80,0,0,0],[1.005,0.0008,0,0.86,0,0,0],[1,0,0,0,1,0,0],[1.006,0.001,0,0.72,0,0,0],[1.004,-0.0012,0,0.80,0,0,0],
  [1.006,0,0,0.62,0,0,0],[1.000,0,0.0015,0.86,0,0,0],[1.008,0.002,0,0.965,1,1,0.002],[1.003,0.0008,0,0.75,0,0,0.0012],[1.010,0,0,0.72,0,0,0]];
let PS, PC, PD, PG, pics = [], cur = {i:-1, tex:null, w:16, h:9}, gen = null;
const F = new Float32Array(112), U8 = new Uint8Array(1024);
let lastData = 0, started = false;
const tx = (t) => fetch(t).then(r => r.text());

function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ msg.textContent = 'Shader error: ' + gl.getShaderInfoLog(s); } return s; }
function program(vs, fs){ const p = gl.createProgram(); gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p); const L = {}; return {p, u: n => (n in L) ? L[n] : (L[n] = gl.getUniformLocation(p, n))}; }
function dataTex(n){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, n, 1, 0, gl.RED, gl.UNSIGNED_BYTE, new Uint8Array(n));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
function target(w, h, mips, wrap){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if(floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap || gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap || gl.CLAMP_TO_EDGE);
  if(mips) gl.generateMipmap(gl.TEXTURE_2D);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.bindFramebuffer(gl.FRAMEBUFFER, null); return {t, f}; }
let T = null; const SCALES = [1, 0.85, 0.72, 0.6, 0.5]; const perf = {dts:[], step:0, last:0, good:0};
function ensure(w, h){ if(T && T.w === w && T.h === h) return;
  if(T) [T.scene, ...T.acc].forEach(x => { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); });
  T = {w, h, scene: target(w, h, false), acc: [target(w, h, true), target(w, h, true)], i: 0, key: ''}; }
let specT, peakT, waveT, toneT, toneST;

async function init(){
  const [vs, common, scene, source, compose, display, pj] = await Promise.all(['vert','common','scene','source','compose','display'].map(n => tx('/shaders/' + n + '.glsl')).concat([fetch('/pictures.json').then(r => r.json())]));
  pics = pj;
  PS = program(vs, common + scene); PC = program(vs, common + compose); PD = program(vs, common + display); PG = program(vs, common + source);
  gl.useProgram(PG.p); gl.uniform1i(PG.u('uSpec'), 1);
  gl.useProgram(PS.p); ['uTex','uSpec','uPeak','uWave','uTone','uToneS'].forEach((n, i) => gl.uniform1i(PS.u(n), i));
  gl.useProgram(PC.p); gl.uniform1i(PC.u('uScene'), 0); gl.uniform1i(PC.u('uPrev'), 1);
  gl.useProgram(PD.p); gl.uniform1i(PD.u('uSrc'), 0);
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  specT = dataTex(128); peakT = dataTex(128); waveT = dataTex(256); toneT = dataTex(256); toneST = dataTex(256);
  connect(); requestAnimationFrame(frame);
}

function loadPic(i){
  const p = pics[i]; if(!p) return; cur.i = i;
  if(p.gen){ if(!gen){ gen = target(1920, 1080, true, gl.MIRRORED_REPEAT); } cur.tex = gen.t; cur.w = 1920; cur.h = 1080; return; }
  const img = new Image();
  img.onload = () => { if(cur.i !== i) return; const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    if(cur.tex && cur.tex !== (gen && gen.t)) gl.deleteTexture(cur.tex); cur.tex = t; cur.w = img.naturalWidth; cur.h = img.naturalHeight; };
  img.src = '/pics/' + p.file;
}

function connect(){
  const ws = new WebSocket('ws://' + location.host + '/ws'); ws.binaryType = 'arraybuffer';
  ws.onmessage = e => { const b = e.data; if(b.byteLength < 448 + 1024) return;
    F.set(new Float32Array(b, 0, 112)); U8.set(new Uint8Array(b, 448, 1024)); lastData = performance.now();
    if(!started){ started = true; msg.textContent = 'Press OK on the remote for full screen'; setTimeout(() => msg.style.opacity = 0, 6000); } };
  ws.onclose = () => { started = false; msg.style.opacity = .75; msg.textContent = 'Connecting to Nocturne on your phone…'; setTimeout(connect, 1500); };
}
function fullscreen(){ const d = document.documentElement; (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d); msg.style.opacity = 0; }
addEventListener('keydown', fullscreen); addEventListener('click', fullscreen);

let last = performance.now(); const t0 = last;
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  if(!PS) return;
  // full TV resolution (the browser's pixels x its device pixel ratio, up to 4K), stepping down only if the TV can't keep up
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let W = Math.floor(innerWidth*dpr), H = Math.floor(innerHeight*dpr);
  if(W*H > 3840*2160){ const k = Math.sqrt(3840*2160/(W*H)); W = Math.floor(W*k); H = Math.floor(H*k); }
  if(canvas.width !== W || canvas.height !== H){ canvas.width = W; canvas.height = H; }
  perf.dts.push(dt); if(perf.dts.length > 120) perf.dts.shift();
  if(perf.dts.length >= 60 && now - perf.last > 1500){ const s = [...perf.dts].sort((a,b)=>a-b), ref = Math.min(s[Math.floor(s.length*0.1)], 1/55), rec = perf.dts.slice(-30).reduce((a,b)=>a+b,0)/30;
    if(rec > ref*1.3 && perf.step < SCALES.length-1){ perf.step++; perf.last = now; perf.good = now; } else if(rec < ref*1.08){ if(now - perf.good > 4000 && perf.step > 0){ perf.step--; perf.last = now; perf.good = now; } } else perf.good = now; }
  const w = Math.max(2, Math.round(W*SCALES[perf.step])), h = Math.max(2, Math.round(H*SCALES[perf.step]));
  ensure(w, h);
  const live = now - lastData < 1500;
  const style = live ? Math.round(F[1]) : 2, pi = Math.round(F[2]);
  if(pics.length && pi !== cur.i && pi >= 0 && pi < pics.length) loadPic(pi);
  const key = pi + '|' + style; if(T.key !== key){ T.key = key; T.acc.forEach(x => { gl.bindFramebuffer(gl.FRAMEBUFFER, x.f); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }); }
  if(!live){ gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,W,H); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
  if(!cur.tex) return;
  const up = (t, u, off, n) => { gl.activeTexture(gl.TEXTURE0 + u); gl.bindTexture(gl.TEXTURE_2D, t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, n, 1, gl.RED, gl.UNSIGNED_BYTE, U8.subarray(off, off + n)); };
  up(specT, 1, 0, 128); up(peakT, 2, 128, 128); up(waveT, 3, 256, 256); up(toneT, 4, 512, 256); up(toneST, 5, 768, 256);
  const pic = pics[pi] || pics[0];
  if(pic.gen && gen){
    gl.bindFramebuffer(gl.FRAMEBUFFER, gen.f); gl.viewport(0, 0, 1920, 1080); gl.useProgram(PG.p);
    gl.uniform2f(PG.u('uRes'), 1920, 1080); gl.uniform1f(PG.u('uTime'), F[12]); gl.uniform1f(PG.u('uPhase'), F[11]*3);
    gl.uniform1f(PG.u('uBass'), F[4]); gl.uniform1f(PG.u('uHigh'), F[6]); gl.uniform1f(PG.u('uLevel'), F[33]); gl.uniform1f(PG.u('uKick'), F[7]); gl.uniform1f(PG.u('uGen'), pic.gen);
    gl.drawArrays(gl.TRIANGLES, 0, 3); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, gen.t); gl.generateMipmap(gl.TEXTURE_2D);
  }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, cur.tex);
  // 1. scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, T.scene.f); gl.viewport(0, 0, w, h); gl.useProgram(PS.p); const u = PS.u;
  pic.pal.forEach((c, k) => gl.uniform3fv(u('uPal' + k), c));
  gl.uniform2f(u('uRes'), w, h); gl.uniform2f(u('uShake'), F[28], F[29]); gl.uniform1f(u('uTime'), F[3]);
  const f1 = (n, v) => gl.uniform1f(u(n), v);
  f1('uLow', F[4]); f1('uMid', F[5]); f1('uHigh', F[6]); f1('uLowHit', F[7]); f1('uMidHit', F[8]); f1('uHighHit', F[9]);
  f1('uLowT', F[10]); f1('uMidT', F[11]); f1('uHighT', F[12]); f1('uCore', F[13]); f1('uKAge', F[14]);
  f1('uTravel', F[15]); f1('uSpeed', F[16]); f1('uSpin', F[17]); f1('uHyE', F[18]); f1('uNStr', F[19]); f1('uWaveK', F[20]); f1('uLowA', F[21]);
  f1('uEnergy', F[22]); f1('uInt', F[23]); f1('uAggr', F[24]); f1('uAssemble', F[25]); f1('uBgT', F[26]); f1('uE', F[27]);
  f1('uMode', style); f1('uBars', F[34]); f1('uLayout', F[35]); f1('uBassMid', F[36]); f1('uSeg', F[37]); f1('uColor', F[38]); f1('uPeakOn', F[39]);
  f1('uImgAsp', cur.w/cur.h);
  gl.uniform1fv(u('uCh'), F.subarray(48, 59)); gl.uniform1fv(u('uChHit'), F.subarray(59, 70));
  gl.uniform1fv(u('uStr'), F.subarray(70, 77)); gl.uniform1fv(u('uFlow'), F.subarray(77, 84)); gl.uniform1fv(u('uSHit'), F.subarray(84, 91));
  gl.uniform1fv(u('uSAge'), F.subarray(91, 98)); gl.uniform1fv(u('uSWK'), F.subarray(98, 105)); gl.uniform1fv(u('uSGlow'), F.subarray(105, 112));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 2. trails
  const src = T.acc[T.i], dst = T.acc[1 - T.i]; gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f); gl.useProgram(PC.p); const c = PC.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, T.scene.t); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.t);
  const [zoom, rot, shiftY, decay0, keep, warp, hue] = STY[style] || STY[2];
  const E = F[30], L0 = F[4], L1 = F[5], L2 = F[6], H0 = F[7], H2 = F[9], tr = F[43], trip = F[40], f60 = dt*60*F[31], calmFade = 2.2 - 1.2*E;
  const decay = decay0 <= 0.02 ? 0 : keep ? Math.pow(decay0 - 0.02, dt*60*calmFade) : (tr === 0 ? 0 : Math.pow(Math.min(0.93, decay0 - 0.2 + (tr - 1)*0.16), dt*60*calmFade));
  gl.uniform1f(c('uWarp'), (warp*L2*1.3 + trip*L2)*E); gl.uniform1f(c('uHue'), (hue + trip*0.0015)*L1*1.4*E*f60); gl.uniform1f(c('uTime'), F[12]*1.5);
  gl.uniform2f(c('uRes'), w, h); gl.uniform2f(c('uShift'), 0, shiftY*(L0*0.7 + L2*0.9)*f60);
  gl.uniform1f(c('uZoom'), 1 + ((zoom - 1)*L0*1.5*E + H0*0.005*E)*f60); gl.uniform1f(c('uRot'), rot*L1*1.6*E*f60); gl.uniform1f(c('uDecay'), decay);
  gl.uniform1f(c('uAberr'), (H0*0.004 + H2*0.002)*E); gl.uniform1f(c('uFlash'), F[44] ? H0*H0*0.05*E : 0); gl.uniform3fv(c('uFlashCol'), pic.pal[1]);
  gl.uniform1f(c('uRed'), F[42] ? F[32] : 0); gl.uniform1f(c('uAggr'), F[41] ? F[24] : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindTexture(gl.TEXTURE_2D, null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t); gl.generateMipmap(gl.TEXTURE_2D);
  // 3. bloom to the screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(PD.p);
  gl.uniform2f(PD.u('uRes'), W, H); gl.uniform1f(PD.u('uBloom'), (0.15 + L0*0.22)*E); gl.uniform1f(PD.u('uExpo'), 0.1 + 0.9*Math.pow(F[22] || 0, 1.3));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  T.i = 1 - T.i;
}
if(gl) init();
</script>
</body></html>
