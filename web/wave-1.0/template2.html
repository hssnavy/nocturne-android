<title>Nocturne Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: the visual fills the screen; one control bar floats at the bottom and fades while music plays; settings open as a sheet above it. */
:root{
  --void:#000;
  --ink:#e9edf2;
  --dim:#8a93a0;
  --glass:rgba(10,12,16,.78);
  --line:rgba(233,237,242,.13);
  --ember:#ff6a2b;
  --font-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
[hidden]{display:none!important}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;pointer-events:none;transition:opacity .6s}
.hud .num{font-family:var(--font-num);font-size:11px;letter-spacing:.14em;color:var(--dim)}
.hud .name{font-weight:300;font-size:20px;letter-spacing:.02em}
.hud .opt{font-size:12px;color:var(--dim);letter-spacing:.06em}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-top:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:center;transition:opacity .6s,transform .6s}
.panel{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:1240px}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:2px}
button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .2s,border-color .2s;position:relative}
button:hover{background:rgba(233,237,242,.07)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
button.on{border-color:var(--ember);color:#fff;background:rgba(255,106,43,.16)}
button.rec::after{content:"";position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--ember)}
button.icon{width:34px;height:34px;padding:0;display:grid;place-items:center}
input[type=range]{accent-color:var(--ember);width:150px}
#seekr{width:min(380px,58vw)}
#teach{flex-basis:100%;justify-content:center}
#teachr{width:min(260px,60vw)}
#curve{width:min(900px,92vw);height:44px;border:1px solid var(--line);border-radius:6px;background:#000;cursor:pointer}
#teach .hint{font-size:11px;color:var(--dim);min-width:120px}
#seek .icon{width:40px;font-size:11px}
.bands{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.band{display:flex;flex-direction:column;gap:4px}
.band span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.band b{display:block;width:46px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.band b i{display:block;height:100%;width:0;background:var(--ember)}
.band.hit span{color:#fff}
.band.hit b i{background:#fff}
.chs{display:flex;gap:3px;align-items:flex-end}
.ch{display:flex;flex-direction:column;align-items:center;gap:3px}
.ch b{display:flex;align-items:flex-end;width:9px;height:22px;border-radius:2px;background:var(--line);overflow:hidden}
.ch b i{display:block;width:100%;height:0;background:var(--ember)}
.ch span{font-family:var(--font-num);font-size:8px;color:var(--dim)}
.ch.sub b{width:14px}
.ch.hit b i{background:#fff}
.ch.hit span{color:#fff}
.hidden-ui .bar{opacity:0;transform:translateY(16px);pointer-events:none}
.hidden-ui .hud{opacity:0}
.hidden-ui{cursor:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-height:78%;overflow:auto;background:rgba(4,5,7,.95);border-top:1px solid var(--line);padding-block:16px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head h2{font-weight:400;font-size:15px;margin:0;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid button{border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;background:#050608}
.grid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.grid span{padding:7px 9px;font-size:12px;color:var(--dim)}
.grid button.on span{color:#fff}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px 28px;max-width:1200px}
.row{display:flex;flex-direction:column;gap:8px;min-width:0}
.row .seg{display:flex;flex-wrap:wrap;gap:6px}
.row .hint{font-size:11px;color:var(--dim)}
.val{font-family:var(--font-num);font-size:11px;color:var(--ink);min-width:34px}
.row .val{font-family:var(--font-num);font-size:11px;color:var(--ink)}
.toast{position:fixed;z-index:8;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;line-height:1.45;backdrop-filter:blur(12px)}
.file{display:none}
@media (max-width:640px){.hud .name{font-size:16px}.panel{gap:8px 10px;padding:9px 10px}button{padding:6px 10px;font-size:12px}}
@media (prefers-reduced-motion:reduce){.bar,.hud{transition:none}}
</style>

<canvas id="gl" aria-label="Music visualizer"></canvas>

<div class="hud" aria-live="polite">
  <div class="num" id="num"></div>
  <div class="name" id="pname"></div>
  <div class="opt" id="oname"></div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="sheet" id="picsheet" hidden>
  <div class="sheet-head"><h2>Pictures</h2><button data-close="picsheet">Close</button></div>
  <div class="grid" id="grid"></div>
</div>

<div class="sheet" id="setsheet" hidden>
  <div class="sheet-head"><h2>Equalizer settings</h2><div class="group"><button id="reset">Reset</button><button data-close="setsheet">Close</button></div></div>
  <div class="rows" id="rows"></div>
</div>

<div class="bar">
  <div class="panel">
    <div class="group">
      <button class="icon" id="prev" aria-label="Previous picture">‹</button>
      <button id="pics">Pictures</button>
      <button class="icon" id="next" aria-label="Next picture">›</button>
    </div>
    <div class="group" id="styles"><span class="label">Style</span></div>
    <div class="group" id="srcs">
      <span class="label">Sound</span>
      <button data-src="demo">Demo track</button>
      <button data-src="file">Music file</button>
      <button data-src="mic">Microphone</button>
      <button data-src="system" id="sysBtn">This device</button>
    </div>
    <div class="group" id="seek" hidden>
      <button class="icon" id="back10" aria-label="Back 10 seconds" title="Back 10 s">−10</button>
      <span class="val" id="tcur">0:00</span>
      <input type="range" id="seekr" min="0" max="1000" value="0" step="1" aria-label="Position in the track">
      <span class="val" id="tdur">0:00</span>
      <button class="icon" id="fwd10" aria-label="Forward 10 seconds" title="Forward 10 s">+10</button>
      <button id="teachBtn">Teach energy</button>
    </div>
    <div class="group" id="teach" hidden>
      <span class="label">Energy now</span>
      <input type="range" id="teachr" min="0" max="10" step="0.5" value="3" aria-label="Energy at this moment">
      <span class="val" id="teachv">3</span>
      <canvas id="curve" width="900" height="44" aria-label="Energy curve for the track"></canvas>
      <button id="useTaught" class="on">Using my energy</button>
      <button id="clearTaught">Clear</button>
      <span class="hint" id="teachMsg"></span>
    </div>
    <div class="group">
      <div class="bands" title="What the music is doing right now">
        <div class="chs" id="chs" aria-hidden="true"></div>
        <div class="band"><span>Energy</span><b><i id="m-energy"></i></b></div>
        <span class="val" id="m-bpm">— BPM</span>
      </div>
      <button id="setbtn">Settings</button>
      <button id="fs">Full screen</button>
    </div>
  </div>
</div>
<input type="file" accept="audio/*" class="file" id="filein">

<script>
const PICS = /*__DATA__*/[];
let meterEls, bpmEl, energyEl;

const STYLES = [
  {id:'bars',    name:'Spectrum bars', fb:{zoom:1.000, rot:0,      shift:[0,0.0015], decay:0.80}},
  {id:'radial',  name:'Radial',        fb:{zoom:1.005, rot:0.0008, shift:[0,0],      decay:0.86}},
  {id:'wave',    name:'Wave',          fb:{zoom:1, rot:0, shift:[0,0], decay:0, keep:true}},   // no trails: a clean, calm line
  {id:'tunnel',  name:'Tunnel',        fb:{zoom:1.006, rot:0.001,  shift:[0,0],      decay:0.72}},
  {id:'kaleido', name:'Kaleidoscope',  fb:{zoom:1.004, rot:-0.0012,shift:[0,0],      decay:0.80}},
  {id:'shatter', name:'Shatter',       fb:{zoom:1.006, rot:0,      shift:[0,0],      decay:0.62}},
  {id:'rise',    name:'Rising sparks', fb:{zoom:1.000, rot:0,      shift:[0,0.0015], decay:0.86}},
  {id:'warp',    name:'Warp',          fb:{zoom:1.008, rot:0.002,  shift:[0,0],      decay:0.965, keep:true, warp:1, hue:0.002}},
  {id:'fractal', name:'Fractal',       fb:{zoom:1.003, rot:0.0008, shift:[0,0],      decay:0.75, hue:0.0012}},
];

const DEFAULTS = {aggcolor:'on', trip:0.5, peakred:'on', sens:1.0, response:'instant', bars:48, peaks:'fast', layout:'bottom', bass:'left', seg:'off', color:'picture', trails:'short', flash:'on', shake:'on',
  quality:'auto'};
let S = Object.assign({}, DEFAULTS);
let styleByPic = {};
try {
  const st = JSON.parse(localStorage.getItem('nocturne10') || '{}');
  if(st.S) S = Object.assign({}, DEFAULTS, st.S);
  if(st.styles) styleByPic = st.styles;
} catch(e){}
function save(){ try { localStorage.setItem('nocturne10', JSON.stringify({S, styles:styleByPic, p:picIndex})); } catch(e){} }

const SETTINGS = [
  {k:'sens', label:'Sensitivity', type:'range', min:0.3, max:3, step:0.05, hint:'Raise it for quiet music or the microphone.'},
  {k:'response', label:'Response', opts:[['smooth','Smooth'],['fast','Fast'],['instant','Instant']]},
  {k:'bars', label:'Bars', opts:[[24,'24'],[48,'48'],[72,'72'],[96,'96']]},
  {k:'peaks', label:'Peak markers', opts:[['off','Off'],['slow','Slow fall'],['fast','Fast fall']]},
  {k:'layout', label:'Direction', opts:[['bottom','Bottom up'],['center','Center out'],['top','Top down']]},
  {k:'bass', label:'Bass position', opts:[['left','Left'],['middle','Middle']]},
  {k:'seg', label:'LED segments', opts:[['off','Off'],['on','On']]},
  {k:'trip', label:'Trippy', opts:[[0,'Off'],[0.5,'On'],[1,'Max']], hint:'Bends, spins and shifts the colours of the trails.'},
  {k:'aggcolor', label:'Colour follows intensity', opts:[['off','Off'],['on','On']], hint:'Colours shift and deepen as the music gets more aggressive.'},
  {k:'peakred', label:'Red at peaks', opts:[['off','Off'],['on','On']], hint:'Turns red only at the loudest moments of the track.'},
  {k:'color', label:'Colour', opts:[['picture','Picture'],['palette','Palette'],['heat','Heat (palette)'],['rainbow','Rainbow']], hint:'Picture uses the picture itself; Palette and Heat use its main colours.'},
  {k:'trails', label:'Trails', opts:[['off','Off'],['short','Short'],['long','Long']]},
  {k:'flash', label:'Beat flash', opts:[['off','Off'],['on','On']]},
  {k:'shake', label:'Screen shake', opts:[['off','Off'],['on','On']]},
  {k:'quality', label:'Quality', opts:[['auto','Auto (smoothest)'],['balanced','Balanced'],['high','High (up to 4K)']], hint:'Auto lowers the detail slightly when needed to keep the frame rate at your screen\'s refresh rate.'},
];

const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, ms=6000){ toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.hidden=true, ms); }

// ---------- WebGL ----------
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {antialias:false, depth:false, stencil:false, premultipliedAlpha:false, powerPreference:'high-performance', desynchronized:true});
if(!gl) toast("This browser can't run the visualizer (WebGL 2 is missing). Try a recent Chrome or Edge.", 60000);
const floatOK = gl && !!gl.getExtension('EXT_color_buffer_float');

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const COMMON = `#version 300 es
precision highp float;
#define TAU 6.2831853
out vec4 o;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<3;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
float luma(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
vec3 hueRot(vec3 c, float a){ const vec3 k=vec3(0.57735); float ca=cos(a); return c*ca + cross(k,c)*sin(a) + k*dot(k,c)*(1.-ca); }
`;

const SCENE_FS = COMMON + `
uniform sampler2D uTex, uSpec, uPeak, uWave, uTone;
uniform vec3 uPal0, uPal1, uPal2, uPal3;
uniform vec2 uRes, uShake;
// lows / mids / highs: smoothed level (1 ~ typical for this song), hits (0-1, transients), and their own clocks
uniform float uLowA, uWaveK; uniform float uStr[3]; uniform float uFlow[3];
uniform float uLow, uMid, uHigh, uLowHit, uMidHit, uHighHit, uLowT, uMidT, uHighT;
// 10-band equaliser channels (31 Hz ... 16 kHz) + the .1 sub channel (index 10)
uniform float uCh[11]; uniform float uChHit[11];
uniform float uEnergy, uInt, uTime, uAssemble, uAggr;
uniform float uMode, uBars, uLayout, uBassMid, uSeg, uColor, uPeakOn, uImgAsp;

float tn(float x){ return texture(uTone, vec2(clamp(x,0.002,0.998),.5)).r*1.3; }
float sp(float x){ return texture(uSpec, vec2(clamp(x,0.004,0.996),.5)).r; }
float pk(float x){ return texture(uPeak, vec2(clamp(x,0.004,0.996),.5)).r; }
vec3 pal(float t){ t = clamp(t + uAggr*0.45, 0., 1.)*3.;
  if(t < 1.) return mix(uPal0,uPal1,t); if(t < 2.) return mix(uPal1,uPal2,t-1.); return mix(uPal2,uPal3,t-2.); }
vec3 tex(vec2 uv){ return texture(uTex, uv).rgb; }
vec3 shade(vec2 uv, float t, float e){
  vec3 p = pal(t);
  vec3 tc = tex(uv); float lm = smoothstep(0.05, 0.3, luma(tc));
  if(uColor < 0.5) return tc*lm*2.4 + p*0.15*lm*e;
  if(uColor < 1.5) return p*(0.35+e*0.8);
  if(uColor < 2.5) return p*lm*(0.6+e*1.2);
  return hueRot(p, uMidT*0.5 + t*4.)*(0.45+e*0.9);
}
vec2 cover(vec2 q){ float a=uRes.x/uRes.y; float s=max(a/uImgAsp,1.); return vec2(q.x/(uImgAsp*s)+0.5, 0.5 - q.y/s); }
float gapm(float w){ return smoothstep(0.06,0.16,w)*(1.-smoothstep(0.84,0.94,w)); }
float height(float f){ return min(pow(f,0.9)*uInt*0.72, 1.); }
mat2 rot(float a){ return mat2(cos(a),-sin(a),sin(a),cos(a)); }
// position on the log spectrum axis (0-1, 30 Hz-16 kHz) -> channel 0-9, blended smoothly between neighbours
float chPos(float fx){ float f = 30.*pow(533.333, clamp(fx,0.,1.)); return clamp(log2(f/22.) - 0.5, 0., 9.); }
float chMix(float b, bool hitv){ int i = int(floor(b)); int j = min(i+1, 9); float t = smoothstep(0.,1.,fract(b));
  return hitv ? mix(uChHit[i], uChHit[j], t) : mix(uCh[i], uCh[j], t); }
float chL(float fx){ return chMix(chPos(fx), false); }
float chH(float fx){ return chMix(chPos(fx), true); }

vec3 barShade(float y, float h, float pv, float g, float ft, vec2 tuv, float glint){
  vec3 col = vec3(0.);
  float inside = g*step(0.,y)*step(y,h);
  if(uSeg > 0.5) inside *= step(0.3, fract(y*26.));
  vec3 c = shade(tuv, ft, h)*(0.4 + 1.2*clamp(y/max(h,0.02),0.,1.));
  col += inside*c;
  float cap = g*(1.-smoothstep(0.,0.016,abs(y-h)))*step(0.015,h);
  col += cap*mix(c,vec3(1.),0.55)*(1. + glint*2.5);          // highs make the caps glint
  if(uPeakOn > 0.5) col += g*(1.-smoothstep(0.,0.012,abs(y-pv-0.025)))*step(0.03,pv)*pal(ft)*1.7;
  col += g*step(h,y)*exp(-(y-h)*14.)*c*0.3;
  return col;
}

void main(){
  vec2 q = (gl_FragCoord.xy - uRes*0.5)/uRes.y + uShake;
  float a = uRes.x/uRes.y;
  vec3 col = vec3(0.);
  float x01 = q.x/a + 0.5;
  float lvl = uLow*0.5 + uMid*0.3 + uHigh*0.2;

  if(uMode < 0.5){ // SPECTRUM BARS  lows: punch · mids: texture flow · highs: cap glints
    float n = uBars, fi = floor(x01*n), xc = (fi+.5)/n, w = fract(x01*n);
    float fx = uBassMid > 0.5 ? abs(xc-.5)*2. : xc;
    float g = gapm(w)*step(0.,x01)*step(x01,1.);
    float punch = 1. + uLowHit*0.18*uInt;
    float hb = chH(fx);
    float h = min(height(sp(fx))*punch*(1. + hb*0.3*uInt), 1.), pv = height(pk(fx));
    float y, refl = 0.;
    if(uLayout < 0.5){ y = (q.y+0.4)/0.86; if(y < 0.){ refl = 1.; y = -y*3.; } }
    else if(uLayout < 1.5){ y = abs(q.y)/0.47; }
    else { y = (0.4-q.y)/0.86; if(y < 0.){ refl = 1.; y = -y*3.; } }
    float glint = max(uHighHit*step(0.55, hash(vec2(fi, floor(uHighT*6.)))), hb);
    col = barShade(y, h, pv, g, fx, vec2(xc*0.9+0.05, 1.-y*0.85 + uMidT*0.25), glint);
    if(refl > 0.5) col *= 0.2*(1.-smoothstep(0.,1.,y));
  }
  else if(uMode < 1.5){ // RADIAL  lows: core size + shockwave · mids: rotation · highs: sparks
    float r = length(q), ang = atan(q.y,q.x);
    float a01 = fract(ang/TAU + 0.25 + uMidT*0.04);
    float n = uBars*2., fi = floor(a01*n), ac = (fi+.5)/n, w = fract(a01*n);
    float fs = abs(ac*2.-1.); if(uBassMid > 0.5) fs = 1.-fs;
    float g = gapm(w);
    float R0 = 0.1 + uLow*0.05*uInt + uLowHit*0.05*uInt;
    float hb = chH(fs);
    float h = min(height(sp(fs))*(1. + hb*0.3*uInt), 1.), pv = height(pk(fs));
    float y = (r-R0)/0.36;
    col = barShade(y, h, pv, g, fs, vec2(ac, 1.-y + uMidT*0.2), max(uHighHit*step(0.6, hash(vec2(fi, floor(uHighT*6.)))), hb));
    if(uLayout > 0.5) col += barShade((R0-r)/0.1, h, pv, g, fs, vec2(ac, y), 0.)*0.6;
    float rn = r/max(R0,0.01);
    vec2 cuv = vec2(a01*2. + rn*0.7, rn*0.45 - uMidT*0.15);
    col += max(shade(cuv, rn, lvl), pal(rn)*0.12*uLow)*(uLow*0.9 + uLowHit*0.7)*(1.-smoothstep(R0-0.012,R0,r));
    col += pal(0.)*exp(-abs(r-R0)*90.)*(uLow*0.6 + uLowHit*1.6);
    float sw = R0 + (1.-uLowHit)*0.7;                                     // shockwave on every kick
    col += pal(0.2)*exp(-abs(r-sw)*60.)*uLowHit*uLowHit*0.9;
    float bin = floor(fract(ang/TAU)*180.), h1 = hash(vec2(bin,3.1));
    float pr = R0 + fract(h1*5. + uHighT*(0.25+h1*0.4))*0.8;
    col += step(0.45,h1)*(1.-smoothstep(0.,0.008,abs(r-pr)))*(1.-smoothstep(0.1,0.4,abs(fract(fract(ang/TAU)*180.)-0.5)))*pal(h1)*(uHigh*2.2 + uHighHit*1.5);
  }
  else if(uMode < 2.5){ // WAVE  ten sections, one per channel: 31 Hz on the left ... 16 kHz on the right; .1 sub lifts the whole line
    float smoke = uEnergy*uEnergy*0.9 + uLowHit*0.15;                         // smoke grows with the song's energy
    vec2 wv = vec2(fbm(q*1.6+vec2(uMidT*0.3,0.)), fbm(q*1.6+vec2(4.,uMidT*0.22))) - 0.5;
    vec3 sm = textureLod(uTex, cover(q*0.6 + wv*(0.9 + uEnergy*0.4)), 5.).rgb;
    col += sm*smoothstep(0.02, 0.12, luma(sm))*smoke*0.7;
    float X = q.x;
    float xe = clamp((x01 - 0.06)/0.88, 0., 1.);
    float bp = clamp(xe*10. - 0.5, 0., 9.);                       // channel under this point
    float cl = chMix(bp, false), chh = chMix(bp, true);
    float env = 1. - smoothstep(0.42, 0.5, abs(x01-0.5));
    // Three strings, one per band: LOW string, MID string, HIGH string.
    //  - each string's height comes from its own band (lows string = bass, etc.)
    //  - the mids make all of them flow, each at its own pace; the highs shorten the wavelength
    //  - the waves start at the RIGHT edge and travel left; wavelength changes spread out from the right
    //  - along each string, every tone of its band (fine 256-bin map, spread over the full width) shapes the line,
    //    so the strings are uneven and detailed rather than symmetric
    float Xr = (0.5 - x01)*uRes.x/uRes.y;                          // distance from the right edge
    float envR = smoothstep(0., 0.05, 1. - x01)*(1. - smoothstep(0.9, 1., 1. - x01));
    float capE = 0.12 + 0.20*uEnergy*uEnergy;
    for(int k=0;k<3;k++){
      float fk = float(k);
      float bandA = uStr[k];                                       // this band's level, against its own range
      float amp = min(bandA*(0.08 + 0.10*uEnergy), capE)*(k==0 ? 1. : k==1 ? 0.85 : 0.7);
      float t0 = k==0 ? 0. : k==1 ? 0.336 : 0.668;                 // this string's third of 20 Hz-20 kHz
      float tw = 0.332;
      float tl = tn(t0 + (1. - x01)*tw);                            // its tones, low end at the right
      float w = uWaveK*(k==0 ? 0.55 : k==1 ? 1. : 1.7);
      float flow = uFlow[k];                                       // stops while this band's sound is steady -> standing wave
      float y = sin(Xr*w - flow + fk*2.1)*0.7 + sin(Xr*w*0.43 - flow*0.6 + fk*1.3)*0.3;
      y *= 0.3 + 0.95*tl;                                           // the band's tones shape the height along the string
      y += sin(Xr*(18. + fk*14.) - flow*1.7 + fk)*tl*0.22;          // fine ripples where its tones play
      y *= amp*envR;
      y += (fk - 1.)*0.012;                                         // strings sit just apart
      float d = abs(q.y - y);
      float thick = 0.0013 + tl*0.0022 + (k==0 ? uLowHit : k==1 ? uMidHit : uHighHit)*0.0015;
      vec3 c = mix(pal(0.08 + fk*0.42), vec3(1.), clamp(tl*0.4, 0., 0.6));
      col += c*(thick/(d+0.0022))*0.34*(0.35 + tl*0.8)*envR;
    }
  }
  else if(uMode < 3.5){ // TUNNEL  lows: forward travel + ring pulses · mids: twist · highs: shimmer stripes
    float r = length(q), ang = atan(q.y,q.x);
    float depth = 0.3/(r+0.015);
    ang += uMidT*0.12 + sin(depth*0.4 + uMidT*0.5)*uMid*0.25;
    vec2 tu = vec2(ang/TAU*2., depth*0.3 + uLowT*0.6);
    vec3 c = shade(tu, fract(depth*0.08), lvl)*(uLow*0.6 + uMid*0.4);
    float ringf = fract(depth*0.6 + uLowT*0.9);
    c += pal(fract(depth*0.05))*(1.-smoothstep(0.,0.06,abs(ringf-0.5)))*(sp(fract(depth*0.05))*uInt*1.4 + chH(fract(depth*0.05))*1.4 + uChHit[10]*0.6);
    float stripes = pow(abs(sin(ang*24. + uHighT*0.6)), 40.);
    c += pal(0.9)*stripes*(uHigh*0.5 + uHighHit*0.6)*smoothstep(0.1,0.5,r);
    col = c*smoothstep(0.05,0.35,r)*uInt*0.9;
  }
  else if(uMode < 4.5){ // KALEIDOSCOPE  lows: zoom pulse · mids: spin · highs: glitter
    vec2 p = rot(uMidT*0.25)*q*(1.15 - uLowHit*0.08*uInt - uLow*0.05);
    float r = length(p), an = atan(p.y,p.x), N = 8., sg = TAU/N;
    an = mod(an, sg); an = abs(an - sg*0.5);
    vec2 fp = r*vec2(cos(an), sin(an));
    vec2 uv = fp*0.8 + vec2(0.3 + uMidT*0.03, 0.35);
    col = shade(uv, fract(r*1.2), lvl)*(uLow*0.55 + uMid*0.45)*uInt*0.9;
    float rr = 0.22 + height(sp(an/sg*2.))*0.25 + chH(an/sg*2.)*0.06;
    col += pal(fract(r*1.5))*(1.-smoothstep(0.,0.012,abs(r-rr)))*1.3*sp(an/sg*2.);
    float gl = step(0.985, hash(floor(fp*90.) + floor(uHighT*6.)));
    col += vec3(1.)*gl*(uHigh*1.2 + uHighHit)*smoothstep(0.03,0.2,luma(col));
  }
  else if(uMode < 5.5){ // SHATTER (unchanged behaviour)
    float uKick = uLowHit, uLevel = lvl;
    float sc = clamp(1. - uAssemble + uKick*0.3*(1.-uAssemble), 0., 1.);
    vec2 grid = vec2(30.,17.);
    vec2 p0 = cover(q);
    vec2 pw = p0 + (vec2(noise(p0*4.+uTime*0.15), noise(p0*4.+7.-uTime*0.15))-0.5)*0.05*sc;
    vec2 cell = floor(pw*grid), lf = fract(pw*grid);
    float tri0 = step(lf.x, lf.y);
    vec2 id = cell*2. + vec2(tri0, 0.);
    vec2 h = vec2(hash(id), hash(id+17.3));
    float h3 = hash(id+5.1);
    float spd = 0.25 + h.x*0.9;
    vec2 drift = vec2(noise(id*0.37 + uTime*spd), noise(id*0.53 + 11. - uTime*spd)) - 0.5;
    float shrink = 1. - sc*(0.25 + 0.55*h3);
    float sa = ((h.y-0.5)*6.2832 + (noise(id*0.71 + uTime*(0.2+h3*0.8))-0.5)*3.)*sc;
    vec2 lfs = rot(sa)*((lf - 0.5 - drift*sc*0.6)/shrink) + 0.5;
    float tri = step(lfs.x, lfs.y);
    float inside = step(0.,lfs.x)*step(lfs.x,1.)*step(0.,lfs.y)*step(lfs.y,1.)*(1.-abs(tri-tri0));
    vec2 srcCell = cell + floor((h-0.5)*grid*sc + drift*grid*0.35*sc + 0.5);
    float ang = (h3-0.5)*6.2832*sc + (noise(id + uTime*(0.3+h.y*1.2))-0.5)*4.*sc;
    vec2 l = rot(ang)*(lfs-0.5);
    float alive = step(h3, 1. - sc*0.55);
    vec2 suv = (srcCell + l + 0.5)/grid;
    float edge = min(min(lfs.x, 1.-lfs.x), min(lfs.y, 1.-lfs.y));
    edge = min(edge, abs(lfs.x-lfs.y)*0.7);
    vec3 c = shade(suv, clamp(luma(tex(suv))*3.,0.,1.), uLevel)*(0.6 + uLevel*0.5*uInt + uAssemble*0.6);
    c += c*(1.-smoothstep(0.,0.05,edge))*sc*uHigh*1.5;
    col = c*inside*alive;
  }
  else if(uMode < 6.5){ // RISING SPARKS  each column rises on its own band's clock · lows: horizon flash
    vec2 uv = cover(q - vec2(sin(q.y*6.+uMidT)*0.02*uLow*uInt, uMidT*0.05));
    col = textureLod(uTex, uv*0.7 + 0.15, 5.).rgb*uMid*0.4;
    float y01 = q.y + 0.5, hz = 0.12;
    for(int L=0; L<3; L++){
      float fL = float(L), cols = 50. + fL*35.;
      float id = floor(x01*cols), fx = fract(x01*cols);
      float hh = hash(vec2(id, fL+2.));
      float fq = (id+.5)/cols; if(uBassMid > 0.5) fq = abs(fq*2.-1.);
      float f = height(sp(fq));
      float tc = fq < 0.33 ? uLowT : (fq < 0.66 ? uMidT : uHighT);
      float yy = fract(y01*(0.8+fL*0.5) - tc*(0.5+hh*0.6)*(1.+fL*0.3) + hh*13.);
      float trail = smoothstep(0.3-f*0.25, 0.75, yy)*(1.-smoothstep(0.75, 0.77, yy));
      float wm = 1. - smoothstep(0.05, 0.35+f*0.1, abs(fx-0.5));
      float cb = chH(fq);
      float amp = smoothstep(0.06, 0.45, f)*step(0.35, hh + f*0.5)*(1. + cb*1.5);
      float top = hz + 0.12 + f*0.62;
      amp *= smoothstep(hz-0.02, hz+0.04, y01)*(1.-smoothstep(top-0.12, top, y01));
      col += max(shade(vec2(fq, 1.-y01 + uMidT*0.1), fq, f), pal(fq)*(0.35+f*0.6))*trail*wm*amp*(1.3-fL*0.3);
    }
    col += pal(x01)*exp(-abs(y01-hz)*40.)*(sp(x01)*uInt*0.35 + chH(clamp(x01,0.,1.))*0.9 + uChHit[10]*0.4);
  }
  else if(uMode < 7.5){ // WARP  lows: ring size + trail zoom · mids: rotation · highs: ripple + glints
    float r = length(q), ang = atan(q.y,q.x), a01 = fract(ang/TAU + 0.25 + uMidT*0.05);
    float fs = abs(a01*2.-1.); if(uBassMid > 0.5) fs = 1.-fs;
    float R = 0.15 + height(sp(fs))*0.17 + uCh[10]*0.04 + uChHit[10]*0.03 + chH(fs)*0.05;
    R += sin(ang*12. + uHighT*2.)*0.006*uHigh;
    float d = abs(r-R);
    vec3 c = max(shade(vec2(a01, uMidT*0.1), fs, lvl), pal(fs)*0.55);
    col += c*(0.0014/(d+0.0016))*(uLow*0.7 + uMid*0.4);
    for(int i=0;i<3;i++){
      float fi = float(i);
      vec2 bp = 0.32*vec2(sin(uMidT*0.5+fi*2.1), cos(uMidT*0.4+fi*1.7));
      col += pal(fi/2.)*0.003/(length(q-bp)+0.012)*uLowHit;
    }
  }
  else { // FRACTAL  lows: breathing fold · mids: rotation · highs: fine-detail sparkle
    vec2 p = rot(uMidT*0.1)*q*(1.5 - uLow*0.15*uInt);
    float k = 0.8 + 0.07*sin(uMidT*0.2) + uLowHit*0.02*uInt;
    vec3 acc = vec3(0.); float w = 0.;
    for(int i=0;i<7;i++){
      p = abs(p)/max(dot(p,p), 0.02) - k;
      float fi = float(i), wt = exp(-fi*0.3)*(1. + uChHit[min(9, 1 + int(fi*1.4))]*1.6)*(i > 3 ? 1. + uHigh*1.2 : 1.);
      acc += max(shade(fract(p*0.22+0.5), fi/6., lvl), pal(fi/6.)*0.16*lvl)*wt; w += wt;
    }
    col = acc/w;
    col *= smoothstep(0.04, 0.4, luma(col))*(uLow*0.6 + uMid*0.5 + uHigh*0.3)*1.2*uInt;
  }
  if(uMode < 4.5 || uMode > 5.5) col *= smoothstep(0.02, 0.15, uEnergy);
  o = vec4(col, 1.);
}`;

const SOURCE_FS = COMMON + `
uniform sampler2D uSpec;
uniform vec2 uRes;
uniform float uTime, uPhase, uBass, uHigh, uLevel, uKick, uGen;
void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 q = (frag-uRes*0.5)/min(uRes.x,uRes.y);
  float t = uTime;
  vec3 col = vec3(0.);
  float xs = uRes.x/min(uRes.x,uRes.y);
  float xn = clamp(q.x/xs + 0.5, 0., 1.);
  float sp = texture(uSpec, vec2(xn, 0.5)).r;
  if(uGen < 1.5){ // Ember Line
    for(int i=0;i<3;i++){
      float fi = float(i);
      float y = (fbm(vec2(q.x*1.4 + uPhase*0.08 + fi*3.1, fi*2.))-0.5)*0.55
              + sp*0.22*sin(q.x*7. + t*1.7 + fi*2.)*(1.-fi*0.3) - 0.05;
      float dd = abs(-q.y - y + fi*0.035);
      float g = 0.0014/(dd+0.0018)*(uLevel*1.2 + uKick*0.6)*(1.-fi*0.3);
      vec3 c = (i==2) ? vec3(0.18,0.32,1.0) : mix(vec3(1.,0.48,0.14), vec3(1.,0.3,0.08), fi);
      col += c*g*0.55;
    }
    col *= 1.-smoothstep(0.25, 0.95, abs(q.x/xs)*2.);
  } else if(uGen < 2.5){ // Ink Smoke
    vec2 p = q*1.7 + vec2(0.4,0.);
    float tt = uPhase*0.05;
    vec2 w = vec2(fbm(p+tt), fbm(p+vec2(3.1,1.7)-tt));
    float f = fbm(p + w*2.2 + vec2(tt*0.5,-tt));
    float v = pow(clamp((f-0.46)*3.2, 0., 1.), 2.2);
    v *= uLevel*0.5 + uBass*0.9 + uKick*0.4;
    v *= smoothstep(-0.9, 0.3, q.x);
    col = mix(vec3(0.12,0.26,0.5), vec3(0.82,0.9,1.0), clamp(v,0.,1.))*v;
  } else { // Halo
    vec2 cc = q - vec2(0.12, 0.);
    float r = length(cc), a = atan(cc.y, cc.x);
    float Rr = 0.32 + uBass*0.03 + uKick*0.02;
    float n = noise(vec2(a*3. + 10., t*0.4 + uPhase*0.05));
    float ring = 0.0016/(abs(r-Rr)+0.002)*(0.35+n)*uLevel*1.2;
    float side = 0.5 + 0.5*cos(a - 2.3);
    col = mix(vec3(0.08,0.55,0.75), vec3(1.0,0.3,0.12), side)*ring*0.6;
    vec2 cell = floor(frag/3.);
    float h = hash(cell);
    float near = exp(-pow((r-Rr-0.03)/0.05, 2.));
    col += vec3(0.9)*step(0.992, h)*near*(0.3+uHigh*2.)*noise(cell*0.3+t*5.);
  }
  o = vec4(clamp(col, 0., 1.), 1.);
}`;

const COMPOSE_FS = COMMON + `
uniform sampler2D uScene, uPrev;
uniform vec2 uRes, uShift;
uniform float uZoom, uRot, uDecay, uAberr, uFlash;
uniform vec3 uFlashCol;
uniform float uRed, uWarp, uHue, uTime, uAggr;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes, c = uv-.5;
  float a = uRes.x/uRes.y;
  vec3 s = vec3(texture(uScene, uv - c*uAberr).r, texture(uScene, uv).g, texture(uScene, uv + c*uAberr).b);
  s = max(hueRot(s, uAggr*uAggr*0.9), 0.)*(1. + uAggr*0.25);
  float sl = luma(s); s = max(mix(vec3(sl), s, 1. + uAggr*0.35), 0.);
  vec2 pc = c*vec2(a,1.);
  float cr = cos(uRot), sr = sin(uRot);
  pc = mat2(cr,-sr,sr,cr)*pc/uZoom;
  pc += uWarp*0.004*vec2(sin(pc.y*5.+uTime*0.3), sin(pc.x*5.-uTime*0.25));
  pc.x /= a;
  vec2 puv = pc + .5 - uShift;
  float inb = step(0.,puv.x)*step(puv.x,1.)*step(0.,puv.y)*step(puv.y,1.);
  vec3 pv = hueRot(texture(uPrev, puv).rgb, uHue)*uDecay*inb;
  vec3 col = max(s, pv) + uFlashCol*uFlash;
  col = mix(col, vec3(1.,0.06,0.02)*luma(col)*2.4, uRed*0.8);
  o = vec4(col, 1.);
}`;

const DISPLAY_FS = COMMON + `
uniform sampler2D uSrc; uniform vec2 uRes; uniform float uBloom, uExpo;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes;
  vec3 c = texture(uSrc, uv).rgb;
  c += (textureLod(uSrc, uv, 3.).rgb*0.45 + textureLod(uSrc, uv, 5.).rgb*0.6)*uBloom;
  c = max(c - 0.025, 0.)*1.03;
  vec3 ex = max(c-0.85, 0.); c = min(c, 0.85) + ex/(1.+ex*1.8);
  c *= 1. - 0.5*pow(length(uv-.5)*1.3, 2.);
  c *= uExpo;                                                      // total light follows the energy of the song
  o = vec4(c, 1.);
}`;

function compile(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(s)); toast("Shader error: " + gl.getShaderInfoLog(s), 60000); } return s; }
function program(fs, names){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  const u = {}; names.forEach(n => u[n] = gl.getUniformLocation(p, n));
  return {p, u};
}
let PS, PC, PD, PG;
let genTarget = null;
const GEN_W = 1920, GEN_H = 1080;
const SPEC_N = 128, WAVE_N = 256, TONE_N = 256;
let toneAn = null, toneFreq = null;
const TONE = {db:new Float32Array(TONE_N), fl:new Float32Array(TONE_N).fill(-100), v:new Float32Array(TONE_N)};
const toneBytes = new Uint8Array(TONE_N);
const specBytes = new Uint8Array(SPEC_N), peakBytes = new Uint8Array(SPEC_N), waveBytes = new Uint8Array(WAVE_N).fill(128);
let specTex, peakTex, waveTex, toneTex, blackTex;
function dataTex(n, data){ const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, n, 1, 0, gl.RED, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
if(gl){
  PS = program(SCENE_FS, ['uTex','uSpec','uPeak','uWave','uPal0','uPal1','uPal2','uPal3','uRes','uShake','uTime','uMid','uHigh','uMode','uBars','uLayout','uBassMid','uSeg','uColor','uInt','uPeakOn','uImgAsp','uAssemble','uLow','uLowHit','uMidHit','uHighHit','uLowT','uMidT','uHighT','uEnergy','uAggr','uCh','uChHit','uTone','uLowA','uWaveK','uStr','uFlow']);
  PC = program(COMPOSE_FS, ['uScene','uPrev','uRes','uShift','uZoom','uRot','uDecay','uAberr','uFlash','uFlashCol','uRed','uWarp','uHue','uTime','uAggr']);
  PD = program(DISPLAY_FS, ['uSrc','uRes','uBloom','uExpo']);
  PG = program(SOURCE_FS, ['uSpec','uRes','uTime','uPhase','uBass','uHigh','uLevel','uKick','uGen']);
  gl.useProgram(PG.p); gl.uniform1i(PG.u.uSpec, 1);
  gl.useProgram(PS.p); gl.uniform1i(PS.u.uTex,0); gl.uniform1i(PS.u.uSpec,1); gl.uniform1i(PS.u.uPeak,2); gl.uniform1i(PS.u.uWave,3); gl.uniform1i(PS.u.uTone,4);
  gl.useProgram(PC.p); gl.uniform1i(PC.u.uScene,0); gl.uniform1i(PC.u.uPrev,1);
  gl.useProgram(PD.p); gl.uniform1i(PD.u.uSrc,0);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  specTex = dataTex(SPEC_N, specBytes); peakTex = dataTex(SPEC_N, peakBytes); waveTex = dataTex(WAVE_N, waveBytes); toneTex = dataTex(TONE_N, toneBytes);
  blackTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, blackTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
}

// render targets
let targets = null;
function makeTarget(w, h, mips){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if(floatOK) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(mips) gl.generateMipmap(gl.TEXTURE_2D);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {t, f};
}
function ensureTargets(w, h){
  if(targets && targets.w === w && targets.h === h) return;
  if(targets) [targets.scene, ...targets.acc].forEach(x => { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); });
  targets = {w, h, scene: makeTarget(w,h,false), acc:[makeTarget(w,h,true), makeTarget(w,h,true)], i:0};
}

const texCache = new Map();
function loadTexture(pic){
  if(texCache.has(pic.id)) return Promise.resolve(texCache.get(pic.id));
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      gl.generateMipmap(gl.TEXTURE_2D);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
      const entry = {tex, w:img.naturalWidth, h:img.naturalHeight};
      texCache.set(pic.id, entry);
      if(texCache.size > 4){ const k = texCache.keys().next().value; if(k !== pic.id){ gl.deleteTexture(texCache.get(k).tex); texCache.delete(k); } }
      res(entry);
    };
    img.onerror = rej; img.src = pic.src;
  });
}

function styleOf(pic){ const s1 = styleByPic[pic.id]; return (s1 && STYLES.some(x => x.id === s1)) ? s1 : pic.styles[0]; }

const stylesEl = document.getElementById('styles');
function renderStyles(){
  stylesEl.querySelectorAll('button').forEach(b => b.remove());
  const pic = PICS[picIndex], cur = styleOf(pic);
  STYLES.forEach((st, i) => {
    const b = document.createElement('button');
    b.textContent = st.name;
    b.className = (st.id === cur ? 'on ' : '') + (pic.styles.includes(st.id) ? 'rec' : '');
    b.title = pic.styles.includes(st.id) ? 'Suggested for this picture' : '';
    b.onclick = () => { styleByPic[pic.id] = st.id; save(); renderStyles(); updateHud(); };
    stylesEl.appendChild(b);

function updateHud(){
  const pic = PICS[picIndex];
  document.getElementById('num').textContent = String(picIndex+1).padStart(2,'0') + ' / ' + String(PICS.length).padStart(2,'0') + (pic.gen ? '  ·  ORIGINAL' : '');
  document.getElementById('pname').textContent = pic.name;
  document.getElementById('oname').textContent = STYLES.find(s => s.id === styleOf(pic)).name;
}
async function selectPic(i){
  picIndex = (i + PICS.length) % PICS.length;
  save(); renderStyles(); updateHud(); renderGrid();
  const pic = PICS[picIndex];
  if(pic.gen){
    if(!genTarget){
      genTarget = makeTarget(GEN_W, GEN_H, true);
      gl.bindTexture(gl.TEXTURE_2D, genTarget.t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    }
    current = {pic, tex:genTarget.t, w:GEN_W, h:GEN_H}; return;
  }
  try { const e = await loadTexture(pic); if(PICS[picIndex] === pic) current = {pic, ...e}; }
  catch(err){ toast("Couldn't load this picture."); }
}

// ---------- Audio ----------
let inBus = null, tAn = null, tFreq = null, tPrev = null;
let actx = null, analyser = null, freq = null, tdata = null, srcKind = null, srcNodes = [], stopFns = [], outBus = null;
function applyResponse(){ if(directAn) directAn.smoothingTimeConstant = {smooth:0.5, fast:0.15, instant:0}[S.response]; if(analyser) analyser.smoothingTimeConstant = {smooth:0.5, fast:0.15, instant:0}[S.response]; }
function ensureCtx(){
  if(!actx){
    actx = NATIVE ? new AudioContext({sampleRate: 48000}) : new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.minDecibels = -100; analyser.maxDecibels = -18;
    freq = new Uint8Array(analyser.frequencyBinCount); tdata = new Uint8Array(analyser.fftSize);
    inBus = actx.createGain(); inBus.connect(analyser);
    tAn = actx.createAnalyser(); tAn.fftSize = 1024; tAn.smoothingTimeConstant = 0; tAn.minDecibels = -100; tAn.maxDecibels = -18;
    inBus.connect(tAn); tFreq = new Uint8Array(tAn.frequencyBinCount); tPrev = new Uint8Array(tAn.frequencyBinCount);
    // fine analyser for the tone map: separates individual notes in the lows and mids
    toneAn = actx.createAnalyser(); toneAn.fftSize = 4096; toneAn.smoothingTimeConstant = 0; toneAn.minDecibels = -100; toneAn.maxDecibels = -18;
    inBus.connect(toneAn); toneFreq = new Uint8Array(toneAn.frequencyBinCount);
    setInterval(tempoTick, 10);
    applyResponse();
  }
  if(actx.state === 'suspended') actx.resume();
}
function stopSource(){
  curAudio = null;
  TEMPO.filled = 0; TEMPO.lastIdx = 0; TEMPO.disagree = 0; A.bpm = 0;
  stopFns.forEach(f => { try{ f(); }catch(e){} }); stopFns = [];
  srcNodes.forEach(n => { try{ n.disconnect(); }catch(e){} }); srcNodes = [];
  srcKind = null; markSrc();
}
function markSrc(){ document.querySelectorAll('#srcs button').forEach(b => b.classList.toggle('on', b.dataset.src === srcKind)); }
let anDelay = null;
function playThrough(n){
  // the speakers play the sound a little after the page hears it; delay the analysis to match
  if(!anDelay){ anDelay = actx.createDelay(1); anDelay.connect(inBus); }
  anDelay.delayTime.value = Math.min(0.04, ((actx.outputLatency || 0) + (actx.baseLatency || 0))*0.5);
  n.connect(actx.destination); n.connect(anDelay);
}

// ---------- Android app: sound captured natively (this phone's playback, or the microphone) ----------
const NATIVE = window.NocturneNative || null;
// The captured sound is analysed the moment it arrives (no audio queue in between): the newest samples go
// into a ring, and these stand-ins for the browser's analysers run their own FFT on the newest 1024 samples.
const NRING = new Float32Array(8192); let nPos = 0;
function pumpNative(){
  if(!NATIVE || nativeMode === null) return;
  const b64 = NATIVE.read(); if(!b64) return;
  const bin = atob(b64), n = bin.length >> 2, dv = new DataView(new ArrayBuffer(bin.length));
  for(let i=0;i<bin.length;i++) dv.setUint8(i, bin.charCodeAt(i));
  for(let i=0;i<n;i++){ NRING[nPos] = dv.getFloat32(i*4, true); nPos = (nPos + 1) & 8191; }
}
function makeDirectAnalyser(N){
  const re = new Float32Array(N), im = new Float32Array(N), win = new Float32Array(N), mag = new Float32Array(N/2), sm = new Float32Array(N/2);
  for(let i=0;i<N;i++){ const x = i/N; win[i] = 0.42 - 0.5*Math.cos(2*Math.PI*x) + 0.08*Math.cos(4*Math.PI*x); }   // Blackman, like the browser's
  const rev = new Uint32Array(N); for(let i=0, bits=Math.log2(N); i<N; i++){ let r=0; for(let b=0;b<bits;b++) r |= ((i>>b)&1) << (bits-1-b); rev[i] = r; }
  const an = {fftSize:N, frequencyBinCount:N/2, smoothingTimeConstant:0, minDecibels:-100, maxDecibels:-18};
  function fft(){
    pumpNative();
    for(let i=0;i<N;i++){ const v = NRING[(nPos - N + i + 8192) & 8191]; re[rev[i]] = v*win[i]; im[rev[i]] = 0; }
    for(let size=2; size<=N; size<<=1){
      const half = size>>1, ang = -2*Math.PI/size;
      for(let st=0; st<N; st+=size) for(let k=0;k<half;k++){
        const c = Math.cos(ang*k), s2 = Math.sin(ang*k), a = st+k, b = a+half;
        const tr = re[b]*c - im[b]*s2, ti = re[b]*s2 + im[b]*c;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
      }
    }
    const tau = an.smoothingTimeConstant;
    for(let k=0;k<N/2;k++){ const m = Math.hypot(re[k], im[k])/N; sm[k] = tau*sm[k] + (1-tau)*m; }
  }
  an.getByteFrequencyData = arr => {
    fft(); const lo = an.minDecibels, sc = 255/(an.maxDecibels - lo);
    for(let k=0;k<arr.length;k++){ const db = 20*Math.log10(sm[k] + 1e-12); arr[k] = Math.max(0, Math.min(255, (db - lo)*sc)); }
  };
  an.getByteTimeDomainData = arr => {
    pumpNative();
    for(let i=0;i<arr.length;i++){ const v = NRING[(nPos - arr.length + i + 8192) & 8191]; arr[i] = Math.max(0, Math.min(255, 128 + v*128)); }
  };
  return an;
}
let nativeMode = null, directAn = null, directT = null, realAn = null, realT = null;
function startNative(mode){
  ensureCtx(); stopSource();
  NATIVE.start(mode); nativeMode = mode; NRING.fill(0);
  if(!directAn){ directAn = makeDirectAnalyser(1024); directT = makeDirectAnalyser(1024); realAn = analyser; realT = tAn; }
  directAn.smoothingTimeConstant = analyser.smoothingTimeConstant;
  analyser = directAn; tAn = directT;
  srcKind = mode === 'mic' ? 'mic' : 'system'; markSrc();
  let lastStatus = '';
  const timer = setInterval(() => {
    const st = NATIVE.status();
    if(st !== lastStatus){
      lastStatus = st;
      if(st === 'device') toast("Listening to the sound this phone plays.", 3000);
      else if(st === 'mic-fallback') toast("Nothing is playing on this phone, so I'm listening through the microphone. Play something and it switches back.", 5000);
      else if(st === 'mic') toast("Listening through the microphone.", 3000);
      else if(st === 'no-permission') toast("Nocturne needs microphone permission to hear sound. Allow it in the phone's settings.", 7000);
    }
  }, 250);
  stopFns.push(() => { clearInterval(timer); NATIVE.stop(); nativeMode = null; analyser = realAn; tAn = realT; });
}

async function startMic(){
  if(NATIVE){ startNative('mic'); return; }
  ensureCtx(); stopSource();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const n = actx.createMediaStreamSource(stream); n.connect(inBus);
    srcNodes.push(n); stopFns.push(() => stream.getTracks().forEach(t=>t.stop()));
    srcKind = 'mic'; markSrc(); toast("Listening through the microphone. Raise Sensitivity in Settings if it looks weak.", 3500);
  }catch(e){
    toast("The microphone is blocked on this page. Open the offline copy (Nocturne.html) in Chrome or Edge to use it, or pick a music file.", 9000);
  }
}
async function startSystem(){
  if(NATIVE){ startNative('device'); return; }
  ensureCtx(); stopSource();
  if(!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia){
    toast("This browser can't capture the device's sound. On a phone, use the microphone in the offline copy, or pick a music file.", 9000); return;
  }
  try{
    const stream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}, systemAudio:'include'});
    if(!stream.getAudioTracks().length){
      stream.getTracks().forEach(t=>t.stop());
      toast("No sound was shared. Try again, choose 'Entire screen', and switch on 'Also share system audio'.", 9000); return;
    }
    const n = actx.createMediaStreamSource(new MediaStream(stream.getAudioTracks())); n.connect(inBus);
    srcNodes.push(n); stopFns.push(() => stream.getTracks().forEach(t=>t.stop()));
    srcKind = 'system'; markSrc(); toast("Reacting to everything this computer plays.", 3000);
  }catch(e){
    toast("Sharing this device's sound isn't allowed on this page. Open the offline copy (Nocturne.html) in Chrome or Edge on Windows to use it.", 9000);
  }
}
const filein = document.getElementById('filein');
filein.onchange = () => {

// ---------- Analysis ----------
// Lows 25-150 Hz (kick, bass) · Mids 150-2500 Hz (vocals, synths, snare body) · Highs 2.5-16 kHz (hats, cymbals, air)
const BANDS = [[25,150],[150,2500],[2500,16000]];
// 10-band EQ (octaves around 31, 62, 125, 250, 500, 1k, 2k, 4k, 8k, 16k Hz) + the .1 subwoofer channel (20-80 Hz)
const CH = [[22,44],[44,88],[88,177],[177,355],[355,710],[710,1420],[1420,2840],[2840,5680],[5680,11360],[11360,20000],[20,80]];
const CH_NAMES = ['31','62','125','250','500','1k','2k','4k','8k','16k','.1'];
const CHS = {t:new Float32Array(11), e:new Float32Array(11), f:new Float32Array(11), avg:new Float32Array(11).fill(0.2), max:new Float32Array(11).fill(0.15),
  lev:new Float32Array(11), hit:new Float32Array(11), last:new Float64Array(11), hist:Array.from({length:11}, () => [])};
const A = {spec:new Float32Array(SPEC_N), peak:new Float32Array(SPEC_N), gpk:0.5, wgain:2, waveF:null, shake:[0,0],
  e:[0,0,0], avg:[0.3,0.3,0.3], lev:[0,0,0], hit:[0,0,0], clock:[0,0,0], fluxH:[[],[],[]], lastHit:[0,0,0], prev:null,
  kicks:[], bpm:0, tempo:1, loudS:0, E:0, Eg:0, int:1, histL:[], histS:[], sampleT:0, pT:0,
  p:{l97:1, lmax:1, s10:0, s50:1, s95:1, smax:1}, red:0, assemble:0, level:0};
function analyse(dt, now){
  const live = !!(srcKind && analyser);
  const relR = {smooth:5, fast:10, instant:20}[S.response];
  const fall = {off:99, slow:0.35, fast:1.3}[S.peaks];
  const e = [0,0,0], flux = [0,0,0];
  if(live){
    analyser.getByteFrequencyData(freq);
    analyser.getByteTimeDomainData(tdata);
    const hz = actx.sampleRate/analyser.fftSize;
    // TONE MAP: every note, however quiet. 256 log bins (30 Hz-16 kHz), the loudest partial in each bin (nothing
    // averaged away), measured against that bin's own noise floor, so a faint tone shows as clearly as its loudness
    // above the floor allows. Silence (below -94 dB) stays at zero.
    const tone = !!(toneAn && analyser !== directAn);
    if(tone) toneAn.getByteFrequencyData(toneFreq);
    const hzT = tone ? actx.sampleRate/toneAn.fftSize : hz;
    let tmax = -200; const rmax = [-200,-200,-200];
    for(let i=0;i<TONE_N;i++){
      const f0 = 20*Math.pow(1000, i/TONE_N), f1 = 20*Math.pow(1000, (i+1)/TONE_N);           // 20 Hz .. 20 kHz
      let m = 0;
      const F = tone && f1 < 1500 ? toneFreq : freq, w = tone && f1 < 1500 ? hzT : hz;
      if(f1 - f0 < w){ // narrower than one FFT bin: interpolate, so the low end is a smooth curve, not steps
        const c = Math.sqrt(f0*f1)/w - 0.5, j = Math.max(0, Math.floor(c)), u = c - j;
        m = F[j]*(1-u) + F[Math.min(F.length-1, j+1)]*u;
      } else { const a = Math.floor(f0/w), b = Math.floor(f1/w); for(let j=a;j<=b && j<F.length;j++) if(F[j] > m) m = F[j]; }
      const d = m < 8 ? -200 : -100 + m/255*82 + 2.5*Math.log2(Math.max(f0,200)/1000);   // slight tilt: highs are naturally quieter
      TONE.db[i] = d; if(d > tmax) tmax = d; const rg = i < 86 ? 0 : i < 171 ? 1 : 2; if(d > rmax[rg]) rmax[rg] = d;
    }
    // each third of the spectrum (lows 20-200 Hz, mids 200 Hz-2.2 kHz, highs 2.2-20 kHz) is measured against ITS OWN
    // recent peak, so faint highs are as visible on their string as the bass is on its own
    if(!TONE.pkR) TONE.pkR = [-60,-60,-60];
    for(let r=0;r<3;r++) TONE.pkR[r] = Math.max(rmax[r], TONE.pkR[r] - dt*1.5, -75);
    for(let i=0;i<TONE_N;i++){
      const d = TONE.db[i];
      if(d > -150) TONE.fl[i] += (d - TONE.fl[i])*Math.min(1, dt*(d < TONE.fl[i] ? 5 : 0.025));     // floor: drops fast, rises very slowly
      // height = how close this tone is to the song's recent peak: the loudest note reaches 1, a note 24 dB quieter
      // still reaches 0.5, one 40 dB down still shows a little. Only the noise floor itself is hidden.
      const pk = TONE.pkR[i < 86 ? 0 : i < 171 ? 1 : 2];
      const ref = Math.max(TONE.fl[i] + 3, pk - 45);
      let t = Math.min(1.2, Math.max(0, (d - ref)/(pk + 2 - ref + 1e-3))*S.sens);
      if(d < -150) t = 0;
      TONE.v[i] = t > TONE.v[i] ? t : TONE.v[i] + (t - TONE.v[i])*Math.min(1, dt*22);
      toneBytes[i] = Math.min(255, TONE.v[i]*196);
    }
    // equalizer spectrum (log-spaced, gentle tilt so highs are visible)
    let gmax = 0; const tmp = new Float32Array(SPEC_N);
    for(let i=0;i<SPEC_N;i++){
      const f0 = 30*Math.pow(16000/30, i/SPEC_N), f1 = 30*Math.pow(16000/30, (i+1)/SPEC_N);
      let a = Math.floor(f0/hz), b = Math.max(a, Math.floor(f1/hz)), s2 = 0, m = 0;
      for(let j=a;j<=b;j++){ const v = freq[Math.min(j,freq.length-1)]; s2 += v; if(v > m) m = v; }
      tmp[i] = (s2/(b-a+1)*0.5 + m*0.5)/255 * (0.8 + 1.1*Math.pow(i/SPEC_N, 1.3));
      if(tmp[i] > gmax) gmax = tmp[i];
    }
    A.gpk = Math.max(A.gpk*Math.pow(0.93, dt), gmax, 0.25);
    if(!A.binAvg) A.binAvg = new Float32Array(SPEC_N);
    for(let i=0;i<SPEC_N;i++){
      A.binAvg[i] += (tmp[i] - A.binAvg[i])*Math.min(1, dt/3);
      const nov = Math.min(1.2, Math.max(0, (tmp[i] - A.binAvg[i])/(A.binAvg[i]*0.6 + 0.03)));
      const ti = Math.max(0, Math.min(TONE_N-2, Math.round(TONE_N*Math.log(30*Math.pow(16000/30, (i+0.5)/SPEC_N)/20)/Math.log(1000))));
      const tv = Math.max(TONE.v[ti], TONE.v[ti+1]);
      const v = Math.min(1.25, tv*0.8 + nov*0.35*S.sens);
      A.spec[i] = v > A.spec[i] ? v : A.spec[i] + (v - A.spec[i])*Math.min(1, dt*relR*1.6);
    }
    // band energy + spectral flux (onsets)
    if(!A.prev) A.prev = new Uint8Array(freq.length);
    for(let b=0;b<3;b++){
      const lo = Math.max(1, Math.floor(BANDS[b][0]/hz)), hi = Math.min(freq.length-1, Math.ceil(BANDS[b][1]/hz));
      let s2 = 0, f = 0;
      for(let i=lo;i<=hi;i++){ s2 += freq[i]; const d = freq[i] - A.prev[i]; if(d > 0) f += d; }
      const n = hi-lo+1;
      e[b] = Math.min(1, s2/(n*255)*S.sens); flux[b] = f/(n*255)*S.sens;
    }
    for(let c=0;c<11;c++){
      const lo = Math.max(1, Math.floor(CH[c][0]/hz)), hi = Math.min(freq.length-1, Math.max(lo, Math.ceil(CH[c][1]/hz)));
      let s2 = 0, f = 0;
      for(let i=lo;i<=hi;i++){ s2 += freq[i]; const d = freq[i] - A.prev[i]; if(d > 0) f += d; }
      const n = hi-lo+1;
      CHS.e[c] = Math.min(1, s2/(n*255)*S.sens); CHS.f[c] = f/(n*255)*S.sens;
      const ti0 = Math.max(0, Math.floor(TONE_N*Math.log(Math.max(20,CH[c][0])/20)/Math.log(1000)));

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, targets.scene.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, src.t);
  const fb = st.fb, tr = {off:0, short:1, long:1.6}[S.trails], f60 = dt*60*A.tempo;
  const calmFade = 2.2 - 1.2*A.E;                                       // trails die out ~2x faster in calm parts
  const decay = fb.keep ? Math.pow(fb.decay - 0.02, dt*60*calmFade) : (tr === 0 ? 0 : Math.pow(Math.min(0.93, fb.decay - 0.2 + (tr-1)*0.16), dt*60*calmFade));
  gl.uniform1f(PC.u.uWarp, ((fb.warp||0)*L[2]*1.3 + S.trip*L[2]*1.0)*A.E);
  gl.uniform1f(PC.u.uHue, ((fb.hue||0) + S.trip*0.0015)*L[1]*1.4*A.E*f60);
  gl.uniform1f(PC.u.uTime, C[2]*1.5);
  gl.uniform2f(PC.u.uRes, w, h);
  gl.uniform2f(PC.u.uShift, fb.shift[0]*L[1]*1.3*f60, fb.shift[1]*(L[0]*0.7 + L[2]*0.9)*f60);
  gl.uniform1f(PC.u.uZoom, 1 + ((fb.zoom-1)*L[0]*1.5*A.E + H[0]*0.005*A.E)*f60);
  gl.uniform1f(PC.u.uRot, (fb.rot*L[1]*1.6*A.E)*f60);
  gl.uniform1f(PC.u.uDecay, decay);
  gl.uniform1f(PC.u.uAberr, (H[0]*0.004 + H[2]*0.002)*A.E);
  gl.uniform1f(PC.u.uFlash, S.flash === 'on' ? H[0]*H[0]*0.05*A.E : 0);
  gl.uniform3fv(PC.u.uFlashCol, pic.pal[1]);
  gl.uniform1f(PC.u.uRed, S.peakred === 'on' ? A.red : 0);
  gl.uniform1f(PC.u.uAggr, S.aggcolor === 'on' ? (A.aggr || 0) : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindTexture(gl.TEXTURE_2D, null);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t); gl.generateMipmap(gl.TEXTURE_2D);

  // 3. bloom to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0,0,W,Hh);
  gl.useProgram(PD.p);
  gl.uniform2f(PD.u.uRes, W, Hh); gl.uniform1f(PD.u.uBloom, (0.15 + L[0]*0.22)*A.E);
  gl.uniform1f(PD.u.uExpo, 0.1 + 0.9*Math.pow(A.Eg || 0, 1.3));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  targets.i = 1 - targets.i;
}

// ---------- UI behaviour ----------
let idleTimer;
function wake(){
  document.body.classList.remove('hidden-ui');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if(srcKind && picsheet.hidden && setsheet.hidden && !TEACH.on) document.body.classList.add('hidden-ui'); }, 3500);
}
['pointermove','pointerdown','keydown','touchstart'].forEach(e => window.addEventListener(e, wake, {passive:true}));
window.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight') selectPic(picIndex+1);
  else if(e.key === 'ArrowLeft') selectPic(picIndex-1);
  else if(TEACH.on && /^[0-9]$/.test(e.key)){ setTeach(e.key === '0' ? 10 : +e.key); }
  else if(/^[1-9]$/.test(e.key)){ styleByPic[PICS[picIndex].id] = STYLES[+e.key-1].id; save(); renderStyles(); updateHud(); }
  else if(e.key === 'f' || e.key === 'F') toggleFs();
  else if(e.key === 'Escape'){ picsheet.hidden = true; setsheet.hidden = true; }
});
function toggleFs(){
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen().catch(()=>toast("Full screen isn't available here. Use the offline copy for full screen.", 5000));
}
document.getElementById('fs').onclick = toggleFs;

const chsEl = document.getElementById('chs');
meterEls = CH_NAMES.map((nm, c) => {
  const box = document.createElement('div'); box.className = 'ch' + (c === 10 ? ' sub' : ''); box.title = c === 10 ? '.1 subwoofer (20-80 Hz)' : nm + ' Hz band';
  const b = document.createElement('b'), i = document.createElement('i'), sp = document.createElement('span');
  sp.textContent = nm; b.appendChild(i); box.append(b, sp); chsEl.appendChild(box);
  return {box, fill:i};
});
bpmEl = document.getElementById('m-bpm'); energyEl = document.getElementById('m-energy');
// ---------- Teach energy ----------
// While a track plays (Demo track or your own Music file), move the slider (or press 1-9, 0 = 10) to say how much
// energy the music has right now. Each song gets its own curve. The page also saves what it measured in the sound
// at the same moments, so Claude can learn the link between the sound and your energy across songs.
const TEACH = {on:false, step:0.5, key:null, name:'', v:null, auto:null, use:true, dirty:false, db:null, lastIdx:-1,
  feat:null, acc:{i:-1, n:0, rms:0, ch:new Float32Array(11), fl:new Float32Array(11)}};
let curName = 'Demo track';
function songKey(){
  if(!curAudio) return null;
  if(srcKind === 'demo') return 'demo';
  const d = isFinite(curAudio.duration) ? Math.round(curAudio.duration) : 0;
  return ('f-' + curName.replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9_\-]+/g, '-').slice(0, 80) + '-' + d).replace(/-+/g, '-');
}
function teachLen(){ return curAudio && isFinite(curAudio.duration) ? Math.ceil(curAudio.duration/TEACH.step) + 1 : 1200; }
function blank(n){ return new Float32Array(n).fill(-1); }
function ensureTeach(){
  const n = teachLen();
  const grow = a => { if(a && a.length >= n) return a; const b = blank(n); if(a) b.set(a.subarray(0, Math.min(n, a.length))); return b; };
  TEACH.v = grow(TEACH.v); TEACH.auto = grow(TEACH.auto);
  if(!TEACH.feat || TEACH.feat.rms.length < n){
    const f = {rms:new Float32Array(n).fill(-999), ch:blank(n*11), fl:blank(n*11)};
    if(TEACH.feat){ f.rms.set(TEACH.feat.rms.subarray(0, Math.min(n, TEACH.feat.rms.length))); f.ch.set(TEACH.feat.ch.subarray(0, Math.min(n*11, TEACH.feat.ch.length))); f.fl.set(TEACH.feat.fl.subarray(0, Math.min(n*11, TEACH.feat.fl.length))); }
    TEACH.feat = f;
  }
}
function setUseButton(){ const b = document.getElementById('useTaught'); b.classList.toggle('on', TEACH.use); b.textContent = TEACH.use ? 'Using my energy' : 'Using automatic energy'; }
// switch to the curve of the song that is playing now
async function loadTeach(){
  const key = songKey(); if(!key || key === TEACH.key) return;
  if(TEACH.key && TEACH.dirty) await saveTeach();
  TEACH.key = key; TEACH.name = srcKind === 'demo' ? 'Demo track' : curName;
  TEACH.v = null; TEACH.auto = null; TEACH.feat = null; TEACH.use = true; TEACH.lastIdx = -1; TEACH.acc.i = -1;
  try {
    const saved = JSON.parse(localStorage.getItem(key === 'demo' ? 'nocturne-energy' : 'nocturne-energy-' + key) || 'null');
    if(saved && saved.v){ TEACH.v = Float32Array.from(saved.v); TEACH.use = saved.use !== false; }
  } catch(e){}
  if(TEACH.db){
    try { const snap = await TEACH.db.doc('energy/' + key).get();
      if(snap.exists && TEACH.key === key){ const d = snap.data();
        if(d && Array.isArray(d.v)){ TEACH.v = Float32Array.from(d.v); TEACH.use = d.use !== false; }
        if(d && d.feat && Array.isArray(d.feat.rms)){ TEACH.feat = {rms:Float32Array.from(d.feat.rms, x => x === null ? -999 : x), ch:Float32Array.from(d.feat.ch), fl:Float32Array.from(d.feat.fl)}; }
      } } catch(e){}
  }
  setUseButton(); ensureTeach();
}
function taughtEnergy(){
  if(!TEACH.use || TEACH.on || !curAudio || !TEACH.v || TEACH.key !== songKey()) return -1;
  const i = Math.floor(curAudio.currentTime/TEACH.step);
  for(let d=0; d<=2; d++){ const a = TEACH.v[i-d], b = TEACH.v[i+d]; if(a >= 0) return a/10; if(b >= 0) return b/10; }
  return -1;
}
function recordAuto(){
  if(!curAudio || !srcKind) return;
  if(TEACH.key !== songKey()){ loadTeach(); return; }
  ensureTeach();
  const i = Math.floor(curAudio.currentTime/TEACH.step);
  TEACH.auto[i] = A.autoE;
  // what the page hears in this half second: loudness (dB) and each of the 11 channels' level and attack
  if(!curAudio.paused){
    const ac = TEACH.acc;
    if(ac.i !== i){
      if(ac.i >= 0 && ac.n > 0 && ac.i < TEACH.feat.rms.length){
        TEACH.feat.rms[ac.i] = Math.round(ac.rms/ac.n*10)/10;
        for(let c=0;c<11;c++){ TEACH.feat.ch[ac.i*11+c] = Math.round(ac.ch[c]/ac.n*255); TEACH.feat.fl[ac.i*11+c] = Math.round(ac.fl[c]/ac.n*2550); }
      }
      ac.i = i; ac.n = 0; ac.rms = 0; ac.ch.fill(0); ac.fl.fill(0);
    }
    let s2 = 0; for(let k=0;k<tdata.length;k+=4){ const x = (tdata[k]-128)/128; s2 += x*x; }
    ac.rms += 10*Math.log10(s2/(tdata.length/4) + 1e-9); ac.n++;
    for(let c=0;c<11;c++){ ac.ch[c] += CHS.e[c]; ac.fl[c] += CHS.f[c]; }
    TEACH.dirty = TEACH.dirty || !!TEACH.db;
  }
  if(TEACH.on && !curAudio.paused){
    const val = parseFloat(document.getElementById('teachr').value);
    if(TEACH.lastIdx >= 0 && i > TEACH.lastIdx && i - TEACH.lastIdx < 6){ for(let k=TEACH.lastIdx+1; k<=i; k++) TEACH.v[k] = val; }
    else TEACH.v[i] = val;
    TEACH.lastIdx = i; TEACH.dirty = true;
    A.E = val/10;                                         // while teaching, the visuals follow your slider
  } else TEACH.lastIdx = -1;
}
function setTeach(val){ const r = document.getElementById('teachr'); r.value = val; document.getElementById('teachv').textContent = val; }
document.getElementById('teachr').addEventListener('input', e => document.getElementById('teachv').textContent = e.target.value);
const teachMsg = m => document.getElementById('teachMsg').textContent = m;
document.getElementById('teachBtn').onclick = () => {
  TEACH.on = !TEACH.on; loadTeach(); ensureTeach();
  document.getElementById('teachBtn').classList.toggle('on', TEACH.on);
  document.getElementById('teach').hidden = !TEACH.on;
  teachMsg(TEACH.on ? 'Teaching: ' + (TEACH.name || '') + ' · move the slider or press 1–9 (0 = 10)' : '');
};
document.getElementById('useTaught').onclick = () => { TEACH.use = !TEACH.use; setUseButton(); TEACH.dirty = true; };
let clearArmed = 0;
document.getElementById('clearTaught').onclick = e => {
  if(Date.now() - clearArmed > 3000){ clearArmed = Date.now(); e.target.textContent = 'Tap again to clear'; setTimeout(() => e.target.textContent = 'Clear', 3000); return; }
  if(TEACH.v) TEACH.v.fill(-1); TEACH.dirty = true; e.target.textContent = 'Clear'; clearArmed = 0; teachMsg('Cleared this song');
};
document.getElementById('curve').addEventListener('click', e => {
  if(!curAudio || !isFinite(curAudio.duration)) return;
  const r = e.target.getBoundingClientRect(); curAudio.currentTime = (e.clientX - r.left)/r.width*curAudio.duration;
});
function drawCurve(){
  const cv = document.getElementById('curve'); if(document.getElementById('teach').hidden) return;
  const g = cv.getContext('2d'), W = cv.width, H = cv.height; g.clearRect(0,0,W,H);
  if(!curAudio || !isFinite(curAudio.duration) || !TEACH.v) return;
  ensureTeach(); const n = Math.ceil(curAudio.duration/TEACH.step);
  const line = (arr, color, wdt, scale) => { g.strokeStyle = color; g.lineWidth = wdt; g.beginPath(); let pen = false;
    for(let i=0;i<n;i++){ const v = arr[i]; const x = i/n*W; if(v < 0){ pen = false; continue; } const y = H - 3 - Math.min(1, v/scale)*(H-6); if(pen) g.lineTo(x,y); else { g.moveTo(x,y); pen = true; } } g.stroke(); };
  line(TEACH.auto, 'rgba(160,170,185,.55)', 1, 1);   // automatic energy is 0..1
  line(TEACH.v, '#ff6a2b', 2, 10);                    // your energy is 0..10
  const px = curAudio.currentTime/curAudio.duration*W; g.fillStyle = '#fff'; g.fillRect(px-1, 0, 2, H);
}
// save: in this browser, and to the page's shared store so Claude can read it
async function saveTeach(){
  if(!TEACH.dirty || !TEACH.v || !TEACH.key) return; TEACH.dirty = false;
  const key = TEACH.key, r1 = x => x < 0 ? -1 : Math.round(x*10)/10;
  const arr = Array.from(TEACH.v, r1);
  try { localStorage.setItem(key === 'demo' ? 'nocturne-energy' : 'nocturne-energy-' + key, JSON.stringify({v:arr, use:TEACH.use})); } catch(e){}
  if(TEACH.db){
    const f = TEACH.feat, doc = {name:TEACH.name, step:TEACH.step, v:arr, use:TEACH.use, updated:Date.now(),
      dur: curAudio && isFinite(curAudio.duration) ? Math.round(curAudio.duration) : 0};
    if(f) doc.feat = {rms:Array.from(f.rms, x => x <= -998 ? null : Math.round(x*10)/10), ch:Array.from(f.ch, x => Math.round(x)), fl:Array.from(f.fl, x => Math.round(x))};
    try { await TEACH.db.doc('energy/' + key).set(doc); if(TEACH.on) teachMsg('Saved · Claude can read it'); }
    catch(e){ if(TEACH.on) teachMsg('Saved in this browser'); }
  }
}
setInterval(drawCurve, 200);
setInterval(() => { const anyTaught = TEACH.v && TEACH.v.some(x => x >= 0); if(anyTaught) saveTeach(); else TEACH.dirty = TEACH.dirty && !!TEACH.on; }, 4000);
(async () => {
  try { const db = window.claude && await window.claude.use('db'); if(db) TEACH.db = db; } catch(e){}
})();

// seek bar for the demo track and music files
const seekEl = document.getElementById('seek'), seekr = document.getElementById('seekr'), tcur = document.getElementById('tcur'), tdur = document.getElementById('tdur');
let seeking = false;
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
seekr.addEventListener('input', () => { seeking = true; if(curAudio && isFinite(curAudio.duration)) tcur.textContent = fmt(seekr.value/1000*curAudio.duration); });
seekr.addEventListener('change', () => { if(curAudio && isFinite(curAudio.duration)) curAudio.currentTime = seekr.value/1000*curAudio.duration; seeking = false; });
document.getElementById('back10').onclick = () => { if(curAudio) curAudio.currentTime = Math.max(0, curAudio.currentTime - 10); };
document.getElementById('fwd10').onclick = () => { if(curAudio && isFinite(curAudio.duration)) curAudio.currentTime = Math.min(curAudio.duration - 0.5, curAudio.currentTime + 10); };
setInterval(() => {
  const ok = !!(curAudio && isFinite(curAudio.duration) && curAudio.duration > 0);
  seekEl.hidden = !ok;
  if(!ok) return;
  tdur.textContent = fmt(curAudio.duration);
  if(!seeking){ seekr.value = Math.round(curAudio.currentTime/curAudio.duration*1000); tcur.textContent = fmt(curAudio.currentTime); }
}, 250);
renderSettings();
selectPic(picIndex);
requestAnimationFrame(frame);
wake();
